# 1. ConfigMap - Simple File Server 설정
apiVersion: v1
kind: ConfigMap
metadata:
  name: simple-file-server-config
  namespace: volume
data:
  PORT: "3001"
  LOG_PATH: "/var/log/app/app.log"
  UPLOAD_DIR: "/var/uploads"
---
# 2. Secret - MySQL 비밀번호
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: volume
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootPassword123!
  MYSQL_DATABASE: flask_db
  MYSQL_USER: flask_user
  MYSQL_PASSWORD: flaskPassword456!
---
# 3. MySQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: volume
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - mysql
                - -h
                - localhost
                - -e
                - SELECT 1
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: mysql-storage
          hostPath:
            path: /tmp/mysql-data
            type: DirectoryOrCreate
---
# 4. MySQL Service
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: volume
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
---
# 5. Simple File Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-file-server
  namespace: volume
  labels:
    app: simple-file-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-file-server
  template:
    metadata:
      labels:
        app: simple-file-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: "worker"
      containers:
        - name: simple-file-server
          image: ghcr.io/jung-geun/simple-file-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: simple-file-server-config
                  key: PORT
            - name: LOG_PATH
              valueFrom:
                configMapKeyRef:
                  name: simple-file-server-config
                  key: LOG_PATH
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: simple-file-server-config
                  key: UPLOAD_DIR
          volumeMounts:
            - name: log-storage
              mountPath: /var/log/app
            - name: upload-storage
              mountPath: /var/uploads
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: log-storage
          hostPath:
            path: /tmp/flask-logs
            type: DirectoryOrCreate
        - name: upload-storage
          hostPath:
            path: /tmp/uploads
            type: DirectoryOrCreate
---
# 6. Simple File Server Service
apiVersion: v1
kind: Service
metadata:
  name: simple-file-server
  namespace: volume
spec:
  type: NodePort
  selector:
    app: simple-file-server
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
---
# 7. Flask App Deployment (simple-db-server) - Secret으로 DB 접속 정보 주입
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: volume
  labels:
    app: flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask
          image: ghcr.io/jung-geun/simple-db-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
# 8. Flask App Service
apiVersion: v1
kind: Service
metadata:
  name: flask-app
  namespace: volume
spec:
  type: NodePort
  selector:
    app: flask
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
